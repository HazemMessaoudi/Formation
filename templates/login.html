<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول – نظام التكوين الديواني</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* ═══ Thèmes UNIFIÉS avec app.css — même index = même identité ═══
   0 أزرق · 1 أخضر · 2 فحمي · 3 عنابي · 4 بنفسجي · 5 ليلي
   La clé localStorage est « app_theme », partagée avec tout le programme :
   le thème choisi ici suit l'agent jusque dans l'application. */
:root{
  --ac:#5b9bd5;--ac2:#8fc0e8;
  --card:linear-gradient(135deg,rgba(10,20,50,.88) 0%,rgba(5,15,45,.92) 100%);
  --btn:#3d7cc9;--btn-h:#5b9bd5;--inp-bg:rgba(255,255,255,.08);
  --inp-border:rgba(91,155,213,.35);--inp-focus:rgba(91,155,213,.7);
  --text:#e6eefb;--text-sub:rgba(143,192,232,.8);--shadow-ac:rgba(91,155,213,.35);
}
body[data-theme="1"]{
  --ac:#4ec38a;--ac2:#86e0b0;
  --card:linear-gradient(155deg,rgba(6,30,20,.9) 0%,rgba(10,45,30,.9) 50%,rgba(4,22,14,.93) 100%);
  --btn:#2f9e6a;--btn-h:#4ec38a;--inp-bg:rgba(120,255,190,.06);
  --inp-border:rgba(78,195,138,.35);--inp-focus:rgba(78,195,138,.7);
  --text:#e0fff0;--text-sub:rgba(78,195,138,.85);--shadow-ac:rgba(78,195,138,.35);
}
body[data-theme="2"]{
  --ac:#c4c8d0;--ac2:#e8ebf0;
  --card:linear-gradient(135deg,rgba(20,20,24,.93) 0%,rgba(32,32,38,.9) 100%);
  --btn:#8a8f9a;--btn-h:#c4c8d0;--inp-bg:rgba(255,255,255,.06);
  --inp-border:rgba(196,200,208,.25);--inp-focus:rgba(196,200,208,.6);
  --text:#eef0f4;--text-sub:rgba(196,200,208,.78);--shadow-ac:rgba(196,200,208,.28);
}
body[data-theme="3"]{
  --ac:#d98a5a;--ac2:#f0b088;
  --card:linear-gradient(145deg,rgba(40,12,12,.92) 0%,rgba(60,20,20,.9) 100%);
  --btn:#b05a34;--btn-h:#d98a5a;--inp-bg:rgba(255,180,140,.06);
  --inp-border:rgba(217,138,90,.3);--inp-focus:rgba(217,138,90,.65);
  --text:#ffe8dc;--text-sub:rgba(217,138,90,.82);--shadow-ac:rgba(217,138,90,.3);
}
body[data-theme="4"]{
  --ac:#C084FC;--ac2:#E9D5FF;
  --card:linear-gradient(140deg,rgba(15,5,35,.92) 0%,rgba(30,10,60,.9) 100%);
  --btn:#C084FC;--btn-h:#A855F7;--inp-bg:rgba(192,132,252,.07);
  --inp-border:rgba(192,132,252,.3);--inp-focus:rgba(192,132,252,.65);
  --text:#f3e8ff;--text-sub:rgba(192,132,252,.75);--shadow-ac:rgba(192,132,252,.3);
}
body[data-theme="5"]{
  --ac:#38bdf8;--ac2:#7dd3fc;
  --card:linear-gradient(135deg,rgba(6,10,18,.95) 0%,rgba(2,6,12,.96) 100%);
  --btn:#0ea5e9;--btn-h:#38bdf8;--inp-bg:rgba(56,189,248,.06);
  --inp-border:rgba(56,189,248,.25);--inp-focus:rgba(56,189,248,.6);
  --text:#e2f2fb;--text-sub:rgba(56,189,248,.78);--shadow-ac:rgba(56,189,248,.3);
}

html,body{height:100%;width:100%;overflow:hidden}
body{font-family:'Cairo','Amiri',sans-serif;position:relative}

canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}

.login-wrap{
  position:relative;z-index:10;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:1rem;
}

.login-card{
  background:var(--card);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  padding:2.6rem 2.8rem 2.2rem;
  width:100%;max-width:420px;
  box-shadow:0 8px 48px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.05),
             inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.logos-row{
  display:flex;align-items:center;justify-content:center;
  gap:1.1rem;margin-bottom:1.4rem;
}
.logo-img{border-radius:50%;object-fit:contain;}
.logo-main{width:76px;height:76px}
.logo-sub {width:54px;height:54px}
.logo-sep{
  width:1px;height:60px;
  background:linear-gradient(to bottom,transparent,var(--ac),transparent);
  opacity:.5;
}

.card-title{
  font-family:'Cairo','Amiri',serif;
  color:var(--ac);
  font-size:1.35rem;
  text-align:center;
  letter-spacing:.01em;
  margin-bottom:.3rem;
}
/* Révélation « à l'écriture » — un wipe RTL qui respecte les ligatures arabes
   (un vrai typewriter lettre-à-lettre casse le façonnage de l'arabe). */
.card-title.type-reveal{ animation:revealTitle 1.25s cubic-bezier(.55,0,.25,1) .2s both; }
@keyframes revealTitle{
  from{ clip-path:inset(0 0 0 100%); opacity:.35; }
  to  { clip-path:inset(0 0 0 0);    opacity:1;   }
}
@media (prefers-reduced-motion: reduce){ .card-title.type-reveal{ animation:none; } }
.card-subtitle{
  color:var(--text-sub);
  font-size:.82rem;
  text-align:center;
  margin-bottom:1.8rem;
}

.form-group{margin-bottom:1.1rem}
.form-group label{
  display:block;
  color:var(--text-sub);
  font-size:.82rem;
  margin-bottom:.4rem;
  letter-spacing:.03em;
}
.form-group input{
  width:100%;
  background:var(--inp-bg);
  border:1px solid var(--inp-border);
  border-radius:9px;
  padding:.7rem 1rem;
  color:var(--text);
  font-family:'Cairo','Amiri',sans-serif;
  font-size:.95rem;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.form-group input::placeholder{color:rgba(255,255,255,.25)}
.form-group input:focus{
  border-color:var(--inp-focus);
  box-shadow:0 0 0 3px var(--shadow-ac);
}

/* ── كشف كلمة المرور : الزرّ داخل الخانة، أقصى اليمين ───────────────────── */
.pwd-wrap{position:relative;display:block}
.pwd-wrap input{padding-right:2.9rem}
.pwd-eye{
  position:absolute;
  top:50%;right:.55rem;transform:translateY(-50%);
  display:flex;align-items:center;justify-content:center;
  width:2rem;height:2rem;
  background:none;border:0;border-radius:6px;
  cursor:pointer;line-height:1;font-size:1.05rem;
  color:var(--ac2);opacity:.75;
  transition:opacity .18s,background .18s;
}
.pwd-eye:hover{opacity:1;background:rgba(255,255,255,.08)}
.pwd-eye:focus-visible{outline:2px solid var(--inp-focus);outline-offset:1px}

.error-msg{
  background:rgba(220,50,50,.15);
  border:1px solid rgba(220,50,50,.35);
  border-radius:8px;
  color:#ff9999;
  font-size:.85rem;
  padding:.55rem .9rem;
  margin-bottom:1rem;
  text-align:center;
}
.info-msg{background:rgba(37,99,235,.14)!important;border-color:rgba(96,165,250,.55)!important;color:#dbeafe!important}

.btn-login{
  width:100%;
  background:var(--btn);
  color:#fff;
  border:none;
  border-radius:10px;
  padding:.78rem;
  font-family:'Cairo','Amiri',sans-serif;
  font-size:1.02rem;
  font-weight:700;
  cursor:pointer;
  letter-spacing:.03em;
  transition:background .2s,transform .12s,box-shadow .2s;
  box-shadow:0 3px 16px var(--shadow-ac);
  margin-top:.4rem;
}
.btn-login:hover{background:var(--btn-h);transform:translateY(-1px);box-shadow:0 6px 22px var(--shadow-ac)}
.btn-login:active{transform:translateY(0)}

/* Theme switcher */
.theme-switcher{
  position:fixed;top:1rem;left:1rem;z-index:20;
  display:flex;flex-direction:column;gap:.45rem;
}
.theme-dot{
  width:22px;height:22px;border-radius:50%;
  border:2px solid rgba(255,255,255,.25);
  cursor:pointer;transition:transform .18s,border-color .18s;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.theme-dot:hover,.theme-dot.active{transform:scale(1.25);border-color:#fff;}
.theme-dot[data-t="0"]{background:radial-gradient(circle,#5b9bd5,#12294f)}
.theme-dot[data-t="1"]{background:radial-gradient(circle,#4ec38a,#06301e)}
.theme-dot[data-t="2"]{background:radial-gradient(circle,#c4c8d0,#20242c)}
.theme-dot[data-t="3"]{background:radial-gradient(circle,#d98a5a,#3a1414)}
.theme-dot[data-t="4"]{background:radial-gradient(circle,#C084FC,#150530)}
.theme-dot[data-t="5"]{background:radial-gradient(circle,#38bdf8,#02060c)}

/* Tous les thèmes de connexion partagent désormais la carte sombre :
   le bouton garde son texte clair, aucune surcharge « carte claire ». */
.btn-login{color:#fff}
</style>

    {% if info %}
    <div class="error-msg info-msg">🔒 {{ info }}</div>
    {% endif %}

    <form method="post" autocomplete="off">
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" name="username" placeholder="أدخل اسم المستخدم" autofocus required>
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <div class="pwd-wrap">
          <input type="password" name="password" placeholder="أدخل كلمة المرور" required>
          <button type="button" class="pwd-eye" onclick="toggleEye(this)" tabindex="-1" title="إظهار/إخفاء كلمة المرور">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn-login">تسجيل الدخول</button>
    </form>
    {# La signature reprend la teinte du thème : en noir par défaut elle
       disparaissait sur le fond sombre de la carte. #}
    <div style="text-align:center;margin-top:1.1rem;font-size:.84rem;
                color:var(--text-sub);letter-spacing:.02em;">
      أنشأ من طرف حازم مسعودي
    </div>
  </div>
</div>

<script>
// ── Password eye toggle ───────────────────────────────────────────────────────
function toggleEye(btn) {
  // v1.7.1 : le champ est cherché dans son cadre .pwd-wrap — un message de
  // validation inséré entre le champ et l'œil ne casse plus le bouton.
  var cadre = btn.closest('.pwd-wrap');
  var inp = cadre ? cadre.querySelector('input') : btn.previousElementSibling;
  if (!inp) return;
  var hidden = inp.type === 'password';
  inp.type = hidden ? 'text' : 'password';
  btn.textContent = hidden ? '🙈' : '👁️';
}
// ── Theme ────────────────────────────────────────────────────────────────────
// Chaque index = identité de app.css. L'animation est retintée en conséquence :
// 0 أزرق→glace · 1 أخضر→matrix · 2 فحمي→or · 3 عنابي→désert · 4 بنفسجي→royal · 5 ليلي→royal
const THEME_DRAWS = [drawIce, drawMatrix, drawGold, drawDesert, drawRoyal, drawRoyal];
// v1.7.1 : sans choix enregistré, thème CLAIR (0), quel que soit le mode de Windows.
let currentTheme = (function () {
  try { const t = localStorage.getItem('app_theme');
        if (t !== null && t !== '' && !isNaN(+t) && +t >= 0 && +t <= 5) return +t; } catch (e) {}
  return 0;
})();
let animId = null;

function setTheme(n) {
  currentTheme = n;
  localStorage.setItem('app_theme', n);          // clé partagée avec tout le programme
  document.body.dataset.theme = n;
  document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', +d.dataset.t === n));
  flashTheme();                                  // ومضة معاينة عند التبديل
  startAnim();
}

// ومضة خفيفة بلون الثيم عند اختياره — معاينة بصرية سريعة
function flashTheme() {
  let f = document.getElementById('themeFlash');
  if (!f) {
    f = document.createElement('div');
    f.id = 'themeFlash';
    f.style.cssText = 'position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;'
      + 'transition:opacity .18s ease;mix-blend-mode:screen;';
    document.body.appendChild(f);
  }
  const ac = getComputedStyle(document.body).getPropertyValue('--ac').trim();
  f.style.background = 'radial-gradient(circle at 50% 50%, ' + ac + '44, transparent 70%)';
  f.style.opacity = '1';
  setTimeout(() => { f.style.opacity = '0'; }, 170);
}

function startAnim() {
  if (animId) cancelAnimationFrame(animId);
  const fn = THEME_DRAWS[currentTheme];
  function loop() { fn(); animId = requestAnimationFrame(loop); }
  loop();
}

// ── Canvas setup ─────────────────────────────────────────────────────────────
const cv = document.getElementById('bg');
const ctx = cv.getContext('2d');
function resize() { cv.width = innerWidth; cv.height = innerHeight; }
window.addEventListener('resize', resize);
resize();

// ── 0: Gold ──────────────────────────────────────────────────────────────────
const goldPts = Array.from({length:120},()=>({
  x:(Math.random()-.5)*6, y:(Math.random()-.5)*6, z:Math.random()*6,
  col: Math.random()<.6 ? '#C9A84C' : '#1a3a8a',
  s: Math.random()*.5+.5, a: Math.random()*Math.PI*2, va: (Math.random()-.5)*.003
}));
const hexAngle = {v:0};
const orbP = {p:0};
function drawGold(){
  const W=cv.width,H=cv.height;
  ctx.fillStyle='rgba(5,10,30,.18)';ctx.fillRect(0,0,W,H);
  hexAngle.v+=.003; orbP.p+=.02;
  const cx=W/2,cy=H/2,fov=350;
  goldPts.forEach(p=>{
    p.a+=p.va; p.z-=.012; if(p.z<.1)p.z=6;
    const scale=fov/(fov+p.z*80);
    const sx=cx+p.x*scale*60, sy=cy+p.y*scale*60;
    const r=p.s*scale*2.2;
    ctx.beginPath();ctx.arc(sx,sy,Math.max(.3,r),0,Math.PI*2);
    ctx.fillStyle=p.col+(Math.floor(scale*200).toString(16).padStart(2,'0'));
    ctx.fill();
  });
  // hexagons
  [80,140,200].forEach((r,i)=>{
    ctx.save();ctx.translate(cx,cy);ctx.rotate(hexAngle.v*(i%2?1:-1));
    ctx.beginPath();
    for(let j=0;j<6;j++){const a=j*Math.PI/3;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
    ctx.closePath();
    ctx.strokeStyle=`rgba(201,168,76,${.12-i*.02})`;ctx.lineWidth=1;ctx.stroke();
    ctx.restore();
  });
  // orb
  const op=.25+Math.sin(orbP.p)*.18;
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,80);
  g.addColorStop(0,`rgba(201,168,76,${op})`);g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,80,0,Math.PI*2);ctx.fill();
}

// ── 1: Desert ────────────────────────────────────────────────────────────────
const duneOffset={v:0};
const dustPts=Array.from({length:60},()=>({x:Math.random()*2000,y:Math.random()*600,s:Math.random()+.3,vy:-(Math.random()*.4+.1)}));
function drawDesert(){
  const W=cv.width,H=cv.height;
  duneOffset.v+=.25;
  const sky=ctx.createLinearGradient(0,0,0,H*.65);
  sky.addColorStop(0,'#1a0d00');sky.addColorStop(.45,'#3d1800');sky.addColorStop(1,'#8B4513');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // glow
  const g=ctx.createRadialGradient(W*.55,H*.55,20,W*.55,H*.55,H*.35);
  g.addColorStop(0,'rgba(255,140,0,.22)');g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // dunes
  [[.7,35,H*.55,.25],[.85,25,H*.65,.4],[1,18,H*.75,.55]].forEach(([yf,amp,base,dark])=>{
    ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=W+10;x+=6){
      const y=base+Math.sin((x+duneOffset.v*.5)*2*Math.PI/320)*amp+Math.sin((x+duneOffset.v*.3)*2*Math.PI/180)*amp*.4;
      x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
    const dg=ctx.createLinearGradient(0,base-amp,0,H);
    dg.addColorStop(0,`rgba(139,69,19,${dark})`);dg.addColorStop(1,`rgba(90,40,5,${dark+.15})`);
    ctx.fillStyle=dg;ctx.fill();
  });
  // dust
  dustPts.forEach(p=>{
    p.y+=p.vy;p.x-=.3;if(p.y<0){p.y=H*.7;p.x=Math.random()*W;}
    ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);
    ctx.fillStyle=`rgba(210,140,60,${p.s*.15})`;ctx.fill();
  });
}

// ── 2: Matrix ────────────────────────────────────────────────────────────────
const CHARS='アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF';
const cols=Math.ceil(typeof innerWidth!=="undefined"?innerWidth/16:80);
const drops=Array.from({length:cols},()=>Math.floor(Math.random()*80));
function drawMatrix(){
  const W=cv.width,H=cv.height;
  ctx.fillStyle='rgba(0,10,5,.16)';ctx.fillRect(0,0,W,H);
  ctx.font='14px monospace';
  drops.forEach((y,i)=>{
    const c=CHARS[Math.floor(Math.random()*CHARS.length)];
    const x=i*16;
    ctx.fillStyle=`rgba(0,255,136,${Math.random()*.5+.3})`;
    ctx.fillText(c,x,y*16);
    if(y*16>H&&Math.random()>.965)drops[i]=0;
    drops[i]++;
  });
  // scan line
  const sl=(Date.now()%4000)/4000*H;
  ctx.fillStyle='rgba(0,255,136,.03)';ctx.fillRect(0,sl,W,3);
}

// ── 3: Ice ───────────────────────────────────────────────────────────────────
const bokeh=Array.from({length:18},()=>({x:Math.random()*2000,y:Math.random()*1200,r:Math.random()*60+20,s:.0005*(Math.random()-.5)}));
const snowflakes=Array.from({length:14},()=>({x:Math.random()*2000,y:Math.random()*1200,r:Math.random()*28+8,rot:Math.random()*Math.PI*2,vr:.003*(Math.random()-.5),vy:.2+Math.random()*.3}));
function drawIce(){
  const W=cv.width,H=cv.height;
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#dce8f8');bg.addColorStop(.5,'#eaf3ff');bg.addColorStop(1,'#c8ddf5');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  bokeh.forEach(b=>{
    b.r+=b.s*W;if(b.r>90||b.r<10)b.s*=-1;
    const g=ctx.createRadialGradient(b.x%W,b.y%H,0,b.x%W,b.y%H,b.r);
    g.addColorStop(0,'rgba(37,99,235,.08)');g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x%W,b.y%H,b.r,0,Math.PI*2);ctx.fill();
  });
  snowflakes.forEach(s=>{
    s.y+=s.vy;s.rot+=s.vr;if(s.y>H+20){s.y=-20;s.x=Math.random()*W;}
    ctx.save();ctx.translate(s.x%W,s.y);ctx.rotate(s.rot);
    ctx.strokeStyle='rgba(37,99,235,.18)';ctx.lineWidth=1.2;
    for(let a=0;a<6;a++){
      ctx.save();ctx.rotate(a*Math.PI/3);
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-s.r);
      ctx.moveTo(0,-s.r*.55);ctx.lineTo(s.r*.22,-s.r*.72);
      ctx.moveTo(0,-s.r*.55);ctx.lineTo(-s.r*.22,-s.r*.72);
      ctx.stroke();ctx.restore();
    }
    ctx.restore();
  });
  // frost edges
  ['top','bottom'].forEach((side,i)=>{
    const g=ctx.createLinearGradient(0,i?H:0,0,i?H-40:40);
    g.addColorStop(0,'rgba(180,210,245,.35)');g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.fillRect(0,i?H-40:0,W,40);
  });
}

// ── 4: Royal ─────────────────────────────────────────────────────────────────
const stars2=Array.from({length:160},()=>({x:Math.random(),y:Math.random(),s:Math.random()*.8+.2,tw:Math.random()*Math.PI*2,tws:.01+Math.random()*.02,col:Math.random()<.7?'#C084FC':'#fff'}));
const swirls=Array.from({length:5},()=>({cx:.1+Math.random()*.8,cy:.1+Math.random()*.8,r:.05+Math.random()*.15,angle:Math.random()*Math.PI*2,va:.002*(Math.random()-.5)+.001}));
const nodes=Array.from({length:12},()=>({x:Math.random(),y:Math.random()}));
function drawRoyal(){
  const W=cv.width,H=cv.height;
  ctx.fillStyle='rgba(8,2,22,.15)';ctx.fillRect(0,0,W,H);
  // nebula
  swirls.forEach(s=>{
    s.angle+=s.va;
    const g=ctx.createRadialGradient(s.cx*W,s.cy*H,0,s.cx*W,s.cy*H,s.r*W);
    g.addColorStop(0,'rgba(192,132,252,.06)');g.addColorStop(.5,'rgba(138,43,226,.03)');g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  });
  // constellation lines
  nodes.forEach((n,i)=>{
    const n2=nodes[(i+3)%nodes.length];
    ctx.beginPath();ctx.moveTo(n.x*W,n.y*H);ctx.lineTo(n2.x*W,n2.y*H);
    ctx.strokeStyle='rgba(192,132,252,.06)';ctx.lineWidth=.7;ctx.stroke();
  });
  // stars
  stars2.forEach(s=>{
    s.tw+=s.tws;
    const alpha=.4+Math.sin(s.tw)*.35;
    ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.s,0,Math.PI*2);
    ctx.fillStyle=s.col+Math.floor(alpha*255).toString(16).padStart(2,'0');
    ctx.fill();
  });
}

// ── Init ─────────────────────────────────────────────────────────────────────
// On applique le thème SANS ومضة au chargement (le flash est réservé au clic).
document.body.dataset.theme = currentTheme;
document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', +d.dataset.t === currentTheme));
startAnim();
</script>
</body>
</html>
