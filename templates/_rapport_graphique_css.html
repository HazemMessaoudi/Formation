{# V3 — Phase 5 : styles communs à la page « التّقارير » et à son export HTML.
   Les rôles de couleur (--rg-*) sont définis une fois ; le thème ليلي
   (data-theme="5") a ses propres pas, validés sur sa surface sombre. #}
<style>
  .rg-racine {
    --rg-serie:#2a78d6; --rg-serie-l:#b3bcc8; --rg-texte:var(--text, #1e2535);
    --rg-muted:var(--text-light, #5a6680); --rg-axe:rgba(0,0,0,.22);
    --rg-surface:var(--card-bg, #fff); --rg-bord:var(--border, #d0d8e4);
  }
  body[data-theme="5"] .rg-racine { --rg-serie:#3987e5; --rg-serie-l:#5d6a82; --rg-axe:rgba(255,255,255,.26); }
  @media (prefers-color-scheme: dark) {
    .rg-export:not([data-theme="light"]) .rg-racine { --rg-serie:#3987e5; --rg-serie-l:#5d6a82; --rg-axe:rgba(255,255,255,.26); }
  }
  .rg-kpis { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:.7rem; margin-bottom:1.1rem; }
  .rg-kpi { background:var(--rg-surface); border:1px solid var(--rg-bord); border-radius:12px; padding:.7rem .9rem;
            border-inline-start:4px solid var(--rg-serie); }
  .rg-kpi__lib { font-size:.8rem; color:var(--rg-muted); }
  .rg-kpi__val { font-size:1.55rem; font-weight:800; color:var(--rg-texte); font-variant-numeric:tabular-nums; line-height:1.3; }
  .rg-kpi__ev { font-size:.76rem; color:var(--rg-muted); }
  .rg-kpi__ev b { color:var(--rg-texte); }
  .rg-carte { background:var(--rg-surface); border:1px solid var(--rg-bord); border-radius:12px; padding:.9rem 1rem .6rem; }
  .rg-analyses { margin-bottom:1.2rem; }
  .rg-analyses h2, .rg-section > h2 { font-size:1.05rem; color:var(--rg-texte); margin:0 0 .6rem; }
  .rg-analyses ul { margin:0; padding-inline-start:1.2rem; line-height:1.95; color:var(--rg-texte); font-size:.93rem; }
  .rg-section { margin-bottom:1.3rem; }
  .rg-section > h2 { border-bottom:2px solid var(--accent, #c8a84b); padding-bottom:.35rem; }
  .rg-grille { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:.9rem; }
  @media (max-width: 900px) { .rg-grille { grid-template-columns:1fr; } }
  .rg-titre { font-size:.95rem; margin:0 0 .4rem; color:var(--rg-texte); }
  .rg-svg { width:100%; height:auto; display:block; font-family:inherit; overflow:visible; direction:rtl; }
  .rg-svg--barres_v { max-height:270px; }
  .rg-barre { fill:var(--rg-serie); transition:opacity .15s; }
  .rg-barre--pale { fill:var(--rg-serie-l); }
  .rg-barre.rg-actif, .rg-seg.rg-actif { opacity:.8; }
  .rg-axe { stroke:var(--rg-axe); stroke-width:1; }
  .rg-val { font-size:12px; font-weight:700; fill:var(--rg-texte); font-variant-numeric:tabular-nums; }
  .rg-val--inv { fill:#fff; }
  .rg-val--petit { font-size:12px; }
  .rg-lib--petit { font-size:12.5px; }
  .rg-svg--barres_g { min-width:640px; }            /* petit écran : défilement horizontal */
  .rg-carte:has(.rg-svg--barres_g) { overflow-x:auto; }
  .rg-leg i.rg-puce { background:var(--rg-serie); }
  .rg-leg i.rg-puce--pale { background:var(--rg-serie-l); }
  .rg-lib { font-size:11.5px; fill:var(--rg-muted); }
  .rg-zone { fill:transparent; cursor:default; }
  .rg-seg { stroke:none; }
  .rg-legende { display:flex; flex-wrap:wrap; gap:.3rem 1rem; justify-content:center; font-size:.82rem; color:var(--rg-muted); }
  .rg-leg { display:inline-flex; align-items:center; gap:.35rem; }
  .rg-leg i { width:.75rem; height:.75rem; border-radius:3px; display:inline-block; }
  .rg-leg b { color:var(--rg-texte); }
  .rg-note { font-size:.82rem; color:var(--rg-muted); margin:-.2rem 0 .6rem; }
  .rg-vide { color:var(--rg-muted); text-align:center; padding:2rem 0; }
  .rg-details { margin-top:.35rem; font-size:.84rem; }
  .rg-details summary { cursor:pointer; color:var(--rg-muted); width:max-content; }
  .rg-table { width:100%; border-collapse:collapse; margin-top:.35rem; }
  .rg-table th, .rg-table td { border-bottom:1px solid var(--rg-bord); padding:.3rem .5rem; text-align:right; color:var(--rg-texte); }
  .rg-table td:last-child, .rg-table th:last-child { text-align:left; font-variant-numeric:tabular-nums; }
  .rg-tip { position:fixed; z-index:9999; pointer-events:none; display:none; background:#1e2535; color:#fff;
            font-size:.82rem; line-height:1.55; padding:.4rem .65rem; border-radius:7px; box-shadow:0 4px 14px rgba(0,0,0,.25); max-width:260px; }
  .rg-dorrat-wrap { overflow-x:auto; }
  .rg-dorrat { width:100%; border-collapse:collapse; font-size:.85rem; min-width:720px; }
  .rg-dorrat th, .rg-dorrat td { border-bottom:1px solid var(--rg-bord); padding:.4rem .45rem; text-align:right; color:var(--rg-texte); }
  .rg-dorrat th { color:var(--rg-muted); font-weight:700; }
  .rg-dorrat td.num { text-align:center; font-variant-numeric:tabular-nums; }
</style>
